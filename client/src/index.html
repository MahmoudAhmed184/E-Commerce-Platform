<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vendra</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="Vendra">
  <meta name="apple-mobile-web-app-title" content="Vendra">
  <meta name="theme-color" content="#00A99D">
  <meta name="msapplication-TileColor" content="#00A99D">
  <meta name="msapplication-TileImage" content="mstile-150x150.png?v=20260522">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260522">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=20260522">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20260522">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png?v=20260522">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260522">
  <link rel="manifest" href="site.webmanifest?v=20260522">
  <script>
    (() => {
      const storageKey = 'vendra-commerce-theme';
      const root = document.documentElement;
      let theme = 'light';

      try {
        const storedPreference = window.localStorage.getItem(storageKey);
        if (storedPreference === 'light' || storedPreference === 'dark') {
          theme = storedPreference;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch {
        theme = 'light';
      }

      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
