<div class="group relative flex flex-col justify-between rounded-lg border border-neutral-200 bg-white p-4 transition-colors hover:border-neutral-400">
  <div class="relative aspect-square w-full overflow-hidden rounded-md bg-neutral-50 p-4">
    <img
      [src]="primaryImage"
      [alt]="product.name"
      class="object-contain transition-transform duration-200 group-hover:scale-[1.01]"
    />
  </div>

  <div class="mt-4 flex flex-col gap-1">
    <div class="flex items-center justify-between text-xs text-neutral-500 font-mono">
      <span>{{ product.category.name }}</span>
      <span class="flex items-center gap-1.5">
        <span class="h-1.5 w-1.5 rounded-full" [class.bg-emerald-500]="product.stock > 0" [class.bg-amber-500]="product.stock === 0"></span>
        {{ product.stock > 0 ? 'IN STOCK' : 'OUT OF STOCK' }}
      </span>
    </div>

    <h3 class="text-sm font-medium text-neutral-950 tracking-tight group-hover:underline">
      <a [routerLink]="['/products', product.slug]">{{ product.name }}</a>
    </h3>

    <div class="mt-2 flex items-center justify-between">
      <span class="font-mono text-sm font-semibold text-neutral-950">${{ product.price }}</span>
    </div>
  </div>
</div>
