<div class="product-card">
  <div class="product-image-container">
    <img [src]="primaryImage" [alt]="product.name" class="product-image" loading="lazy" />
    <div class="stock-badge" [class.out-of-stock]="product.stock === 0">
      {{ product.stock > 0 ? 'In Stock' : 'Out of Stock' }}
    </div>
  </div>

  <div class="product-details">
    <div class="category-name">{{ product.category.name }}</div>
    <h3 class="product-name">
      <a [routerLink]="['/products', product.slug]">{{ product.name }}</a>
    </h3>
    <div class="product-footer">
      <div class="product-price">{{ product.price }}</div>
      <a [routerLink]="['/products', product.slug]" class="btn-view">View</a>
    </div>
  </div>
</div>
