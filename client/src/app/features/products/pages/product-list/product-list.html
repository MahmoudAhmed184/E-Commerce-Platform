<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-12">
  <header class="mb-12">
    <h1 class="text-3xl font-semibold tracking-tight text-neutral-950">Catalog</h1>
    <p class="mt-2 text-neutral-600">Equipment designed for daily utility. In stock and ready to ship.</p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
    <!-- Sidebar Filters -->
    <aside class="md:col-span-1 space-y-6">
      <!-- Search -->
      <div>
        <label class="block text-xs font-medium text-neutral-500 uppercase tracking-wider mb-2">Search</label>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="applyFilters()"
          placeholder="Search by SKU or title..."
          class="w-full px-3 py-2 border border-neutral-200 rounded-lg text-sm focus:border-neutral-900 outline-none"
        />
      </div>

      <!-- Categories -->
      <div>
        <label class="block text-xs font-medium text-neutral-500 uppercase tracking-wider mb-2">Category</label>
        <select
          [(ngModel)]="selectedCategory"
          (change)="applyFilters()"
          class="w-full px-3 py-2 border border-neutral-200 rounded-lg text-sm bg-white outline-none"
        >
          <option value="">All Categories</option>
          @for (cat of categories; track cat.id) {
            <option [value]="cat.slug">{{ cat.name }}</option>
          }
        </select>
      </div>

      <!-- Price Range -->
      <div>
        <label class="block text-xs font-medium text-neutral-500 uppercase tracking-wider mb-2">Price Range</label>
        <div class="flex items-center gap-2">
          <input
            type="number"
            [(ngModel)]="minPrice"
            placeholder="Min"
            class="w-full px-3 py-2 border border-neutral-200 rounded-lg text-sm"
          />
          <span class="text-neutral-400">&mdash;</span>
          <input
            type="number"
            [(ngModel)]="maxPrice"
            placeholder="Max"
            class="w-full px-3 py-2 border border-neutral-200 rounded-lg text-sm"
          />
        </div>
      </div>
    </aside>

    <!-- Product Grid -->
    <main class="md:col-span-3">
      @if (products.length > 0) {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (product of products; track product.id) {
            <app-product-card [product]="product"></app-product-card>
          }
        </div>
      } @else if (!loading) {
        <div class="text-center py-24 border border-dashed border-neutral-200 rounded-xl">
          <h3 class="text-sm font-medium text-neutral-950">No products match</h3>
          <button class="mt-4 text-xs text-neutral-600 underline" (click)="resetFilters()">Clear Filters</button>
        </div>
      }
    </main>
  </div>
</div>
